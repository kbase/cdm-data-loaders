services:
  ceph:
    image: ghcr.io/kbasetest/ceph-rgw-test-image:0.1.5
    environment:
      RGW_PORT: "8080"
      RGW_ACCESS_KEY: test_access_key
      RGW_SECRET_KEY: test_access_secret
    ports:
      - "9000:8080"
      - "9001:8443"
    tmpfs:
      - /var/lib/ceph
    restart: on-failure
    healthcheck:
      # Two-part check:
      # 1. ceph osd stat: verifies at least one OSD has joined the cluster.
      # 2. curl: confirms the RGW HTTP listener is accepting connections.
      # NOTE: ceph health is NOT used here — this image permanently sits at HEALTH_WARN due to
      # AUTH_INSECURE_GLOBAL_ID_RECLAIM_ALLOWED and MON_MSGR2_NOT_ENABLED, so it never passes.
      test: [ "CMD-SHELL", "ceph osd stat 2>/dev/null | grep -qE '[1-9][0-9]* up' && curl -s http://127.0.0.1:8080/ >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  integration-tests:
    image: cdm-data-loaders-integration-tests:latest
    build:
      context: .
    depends_on:
      ceph:
        condition: service_healthy
    environment:
      AWS_ENDPOINT_URL: http://ceph:8080
      AWS_ACCESS_KEY_ID: test_access_key
      AWS_SECRET_ACCESS_KEY: test_access_secret
    entrypoint: [ "/app/scripts/entrypoint.sh", "ceph_integration_test" ]
    command: []
