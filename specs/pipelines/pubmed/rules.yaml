# Rule catalogue for the PubMed XML-to-PyArrow pipeline
# (cdm_data_loaders.pipelines.xmltopyarrow.pipeline: pubmed_cli / run_xmltopyarrow_pipeline;
#  cdm_data_loaders.pipelines.xmltopyarrow.settings: PubMedXmlToPyArrowSettings).
#
# This file and the per-case `case.yaml` manifests are the single source of truth for
# docs/pubmed_pipeline_specification.md, which is generated by scripts/gen_pipeline_spec.py.
# Every rule must be exercised by at least one case (enforced by tests/cdm_data_loaders/pipelines/test_pipeline_smoke_spec.py).
title: PubMed Pipeline Specification
intro: |
  This document specifies the end-to-end contract for the `pubmed` pipeline
  (`cdm_data_loaders.pipelines.xmltopyarrow.pipeline:pubmed_cli`, configured via
  `PubMedXmlToPyArrowSettings`):

  1. **Input discovery and MD5 sidecar validation** (`*.xml.gz` and `<file>.xml.gz.md5` via `validate_md5_sidecar`).
  2. **Level-1 XML element routing** under `<PubmedArticleSet>` into `pubmed_article`,
     `pubmed_book_article`, and `delete_citation` using precomputed PyArrow schemas (`PUBMED_SCHEMAS`).
  3. **Error routing and pipeline report persistence** (`_rejected`, `_load_info`, and `report.txt`).

sections:
  - id: discovery
    title: Input Discovery and MD5 Sidecar Pre-Processing
    rules:
      - id: R-PUBMED-GLOB
        statement: |
          The pipeline scans `input_dir` for files matching `file_glob` (default `*.xml.gz`).
          Accompanying `.md5` sidecar files are not matched as standalone XML inputs.
      - id: R-PUBMED-MD5-PASS
        statement: |
          Before opening an `.xml.gz` file for XML parsing, `validate_md5_sidecar` reads `<file>.md5`,
          computes the MD5 digest of the compressed `.xml.gz` bytes, and verifies they match. Validated
          files proceed to XML extraction and are listed under `ingested_files` in `report.txt`.
      - id: R-PUBMED-MD5-FAIL
        statement: |
          When `<file>.md5` is missing, malformed, or does not match the `.xml.gz` MD5 digest,
          `validate_md5_sidecar` raises `FilePreprocessError`. The pipeline skips XML parsing for that file,
          emits one provenance row to `_rejected` (`table_name=None`, `source_file=<relative_path>`,
          `line_no=None`, `raw_record=None`, `error_detail=<message>`), and records the error under
          `load_errors` in `report.txt` with `status: completed with errors`.

  - id: routing
    title: Level-1 XML Element Routing and Precomputed Schemas
    rules:
      - id: R-PUBMED-LEVEL1
        statement: |
          With `root_tag="PubmedArticleSet"` and `xml_level=1`, the streaming parser extracts direct child
          elements of `<PubmedArticleSet>` (`<PubmedArticle>`, `<PubmedBookArticle>`, and `<DeleteCitation>`)
          and routes each element tag to its normalized destination table (`pubmed_article`,
          `pubmed_book_article`, and `delete_citation`).
      - id: R-PUBMED-SCHEMA
        statement: |
          Extracted element rows are coerced against the precomputed PyArrow schemas in
          `cdm_data_loaders.schemas.pubmed.schema.SCHEMAS` (`PUBMED_ARTICLE_SCHEMA`,
          `PUBMED_BOOK_ARTICLE_SCHEMA`, and `DELETE_CITATION_SCHEMA`), preserving nested structs, lists,
          and raw inner XML strings on mixed-content fields (`ArticleTitle`, `BookTitle`, `AbstractText`).

  - id: metadata
    title: Pipeline Metadata and Load Report
    rules:
      - id: R-PUBMED-REPORT
        statement: |
          Every completed run persists dlt load metadata to `_load_info` in the destination dataset and writes
          `report.txt` containing `pipeline: pubmed`, `dataset: pubmed`, `started`, `finished`, `status`,
          `load_ids`, and `pipeline_load_info_errs`.
