title: Table Transforms, Schema Conversion Skip, and Multi-Table Fan-Out
schema: schema.json
xml_tag: samples
rules:
  - R-JSONL-SCHEMA-SKIP
  - R-JSONL-TRANSFORMS
  - R-JSONL-REPORT
notes: |
  - `transforms_module="specs.pipelines.jsonlines_jsonschema.transforms"` defines `TABLE_TRANSFORMS["samples"] = transform_sample` and `OUTPUT_SCHEMAS` for `samples` and `sample_measurements`.
  - `schema.json` uses JSON Schema Draft-07 (`definitions` / `#/definitions/IsoTimestamp`) and an input-only `anyOf` field (`raw_payload`); `build_output_schema_registry` skips `convert_schema_to_pyarrow` for `samples` while `_make_resolve_error` validates input lines with `Draft7Validator`.
  - `transform_sample` drops `exclude=True` rows, uppercases `sample_id`, computes `ph_bucket`, fans out `metrics` to `sample_measurements`, and leaves `ph`, `collected_date`, `collected_at`, `sample_time`, and `checksum` for `coerce_json_record_for_pyarrow` to coerce into `pa.decimal128(4, 2)`, `pa.date32()`, UTC `pa.timestamp("us", tz="UTC")`, `pa.time64("us")`, and `pa.binary()` (`xsd_type="xs:hexBinary"`).
runs:
  - id: default
    data: data.jsonl
    expected_json: expected.json
    expected_table: expected_table.py
    extra_expected_json:
      sample_measurements: expected_measurements.json
    expected_report:
      status: completed
      ingested_files:
        - samples/data.jsonl
      pipeline_load_info_errs: null
    params:
      entity_type: samples
      entity_schemas: specs.pipelines.jsonlines_jsonschema.transforms
      transforms_module: specs.pipelines.jsonlines_jsonschema.transforms
      output_schemas_module: specs.pipelines.jsonlines_jsonschema.transforms
