title: Scalars, Nullability, and Column Ordering
schema: schema.json
rules:
  - R-XSV-DIALECT
  - R-XSV-REQUIRED-COLS
  - R-XSV-METASCHEMA
  - R-XSV-CONFIG
  - R-XSV-COL-ORDER
  - R-XSV-NULLABILITY
  - R-XSV-SCALAR-MAP
  - R-XSV-CLEAN-INPUT
  - R-XSV-FIRST-PASS
  - R-XSV-SECOND-PASS
  - R-XSV-DUCKDB-TYPES
  - R-XSV-ARROW-CAST
  - R-XSV-GLOB
notes: |
  - The schema omits `x-xsv-config`, so `CleanerValidatorArgs` defaults apply (`delimiter="\t"`, `comment_char="#"`, `missing_header=False`).
  - `properties` declares `score` before `id`, but top-level `required` orders the output columns starting with `id`, `count`, `rank32`, `score`, ...
  - `status` (`{"type": "string"}`) is non-nullable (`nullable=False`, `force_not_null`), while `opt_note` (`{"type": ["string", "null"]}`) allows `null` and becomes `None` when empty.
runs:
  - id: default
    data: data.tsv
    expected_report:
      status: completed
      ingested_files:
        - data.tsv
      pipeline_load_info_errs: null
