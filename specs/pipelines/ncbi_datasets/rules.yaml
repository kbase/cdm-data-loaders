# Rule catalogue for the NCBI Datasets JSONLines-to-PyArrow pipeline
# (cdm_data_loaders.pipelines.jsonlines.extract_jsonschema_validate_pipeline: ncbi_datasets_cli / run_jsonlines_pipeline;
#  cdm_data_loaders.pipelines.jsonlines.settings: NcbiDatasetsSettings).
#
# This file and the per-case `case.yaml` manifests are the single source of truth for
# docs/ncbi_datasets_pipeline_specification.md, which is generated by scripts/gen_pipeline_spec.py.
# Every rule must be exercised by at least one case (enforced by tests/cdm_data_loaders/pipelines/test_pipeline_smoke_spec.py).
title: NCBI Datasets Pipeline Specification
intro: |
  This document specifies the end-to-end contract for the `ncbi_datasets` pipeline
  (`cdm_data_loaders.pipelines.jsonlines.extract_jsonschema_validate_pipeline:ncbi_datasets_cli`,
  configured via `NcbiDatasetsSettings`):

  1. **Directory-per-table discovery** under `input_dir/annotation_report/` and `input_dir/dataset_report/`.
  2. **JSON Schema validation and precomputed PyArrow schemas** from `cdm_data_loaders.schemas.ncbi_datasets.ncbi_openapi`.
  3. **Empty annotation report filtering** via `filter_annotation_report`.
  4. **Rejection provenance and pipeline report persistence** (`_rejected`, `_load_info`, and `report.txt`).

sections:
  - id: routing
    title: Entity Directory Discovery and Table Routing
    rules:
      - id: R-NCBI-ENTITY-DIRS
        statement: |
          The pipeline scans `input_dir/<table_name>/` for files matching `file_glob` (default `*.jsonl*`)
          across the two registered NCBI Datasets tables: `annotation_report` and `dataset_report`.
      - id: R-NCBI-SCHEMA
        statement: |
          Validated records are coerced into PyArrow tables using the precomputed schemas in
          `cdm_data_loaders.schemas.ncbi_datasets.schema.SCHEMAS` (`ANNOTATION_REPORT_SCHEMA` and
          `DATASET_REPORT_SCHEMA`).

  - id: filtering
    title: Annotation Report Filtering
    rules:
      - id: R-NCBI-FILTER-EMPTY
        statement: |
          `filter_annotation_report` inspects each validated `annotation_report` record and drops records
          where top-level `reports` is missing or empty (for example `{"total_count": 0}`). Dropped records
          do not enter `annotation_report` or `_rejected`.
      - id: R-NCBI-KEEP-NONEMPTY
        statement: |
          `annotation_report` records with a non-empty `reports` list pass through `filter_annotation_report`
          into the `annotation_report` table.

  - id: validation
    title: JSON Parsing, Schema Validation, and Rejection Provenance
    rules:
      - id: R-NCBI-REJECT
        statement: |
          Lines that fail JSON parsing or Draft 2020-12 JSON Schema validation are routed to `_rejected`
          with `REJECTED_PYARROW_SCHEMA` (`table_name`, `source_file`, `line_no`, `raw_record`,
          `error_detail`), while valid records in the same file load into their target tables.

  - id: metadata
    title: Pipeline Metadata and Load Report
    rules:
      - id: R-NCBI-REPORT
        statement: |
          Every completed run persists dlt load metadata to `_load_info` in the destination dataset and writes
          `report.txt` containing `pipeline: ncbi_datasets`, `dataset: ncbi_datasets`, `started`, `finished`,
          `status`, `load_ids`, `ingested_files`, and `pipeline_load_info_errs`.
