# Rule catalogue for the PyArrow -> LinkML converter
# (cdm_data_loaders.converters.facades.pyarrow_to_linkml: generate_linkml_schema, generate_linkml_yaml;
#  cdm_data_loaders.coercion.pyarrow: serialize_table_for_linkml, serialize_record_for_linkml).
#
# This file and the per-case `case.yaml` manifests are the single source of truth for
# docs/pyarrow_to_linkml_specification.md, generated by scripts/gen_converter_spec.py.
# Every rule must be exercised by at least one case (enforced by test_pyarrow_to_linkml_spec.py).
title: PyArrow to LinkML Specification
intro: |
  This document specifies how a **PyArrow `pa.Schema`** determines:

  1. The **LinkML `SchemaDefinition`** (and YAML schema string) produced by `generate_linkml_schema`,
     `generate_linkml_yaml`, and `PyArrowToLinkML`, including `linkml:types` scalar ranges, integer bit-width
     bounds (`minimum_value` / `maximum_value`), fixed-size list cardinalities, synthesized nested `ClassDefinition`s
     for Arrow `struct` and `map` columns, and collision-free identifier sanitization.
  2. The **serialized JSON-compatible row dictionaries** produced by `serialize_table_for_linkml` and
     `serialize_record_for_linkml`, ready for LinkML instance validation.
  3. The **errors** raised for Arrow schemas or data types that have no faithful LinkML representation.

sections:
  - id: resolution
    title: Top-Level Schema Resolution and Envelope
    rules:
      - id: R-SCHEMA-INPUT
        statement: |
          The input to `generate_linkml_schema` and `generate_linkml_yaml` must be a concrete `pyarrow.Schema`
          instance; passing a bare `pa.DataType`, `pa.Field`, `pa.Table`, or Python mapping raises **E1**.
      - id: R-NON-EMPTY-ROOT
        statement: |
          The root `pa.Schema` must contain at least one field; an empty `pa.schema([])` raises **E2**.
      - id: R-SCHEMA-IDENTITY
        statement: |
          The candidate name resolves from explicit `schema_name` when provided, otherwise from non-empty UTF-8
          `schema.metadata[b"title"]`. `SchemaDefinition.name` is the sanitized identifier of that candidate
          name (defaulting to `"schema"` when absent), and the root `ClassDefinition.name` is the sanitized
          identifier of that candidate name (defaulting to `"Root"` when absent). `SchemaDefinition.id`
          resolves from explicit `schema_id` when provided, otherwise from non-empty UTF-8
          `schema.metadata[b"$id"]`, defaulting to `"urn:linkml:<SchemaDefinition.name>"`.
      - id: R-IMPORTS-PREFIXES
        statement: |
          Every standalone `SchemaDefinition` imports `"linkml:types"`, sets `default_prefix` to
          `SchemaDefinition.name`, and declares two prefixes: `<SchemaDefinition.name>: "<id>#"` and
          `linkml: "https://w3id.org/linkml/"`. When `destination` is supplied to `generate_linkml_schema`,
          generated classes are appended into `destination.classes` without overwriting prior definitions.

  - id: naming
    title: Slot Naming, Identifier Sanitization, and Collision Disambiguation
    rules:
      - id: R-SLOT-NAME
        statement: |
          Every `pa.Field.name` must contain at least one non-whitespace character and is preserved verbatim as
          its `SlotDefinition` key under `ClassDefinition.attributes`. An empty or whitespace-only field name
          (`""` or `"   "`) raises **E9**.
      - id: R-SLOT-ORDER
        statement: |
          `ClassDefinition.attributes` preserves the exact field declaration order of the source `pa.Schema` or
          `pa.StructType`.
      - id: R-UNIQUE-FIELD-NAMES
        statement: |
          Sibling fields within a `pa.Schema` or `pa.StructType` must have distinct names; duplicate sibling
          field names raise **E3**.
      - id: R-CLASS-IDENTIFIER
        statement: |
          LinkML schema and class identifiers replace characters outside `[A-Za-z0-9_]` with `"_"`, strip
          leading and trailing `"_"`, fall back to `"schema"` when no identifier characters remain, and prepend
          `"_"` when the first character is an ASCII digit (`0`..`9`).
      - id: R-CLASS-COLLISION
        statement: |
          Derived nested struct class names (`<OwnerClass>_<field_name>`) and map entry class names
          (`<OwnerClass>_<field_name>_map`) are deduplicated across the `SchemaDefinition` by appending `_2`,
          `_3`, ... whenever two sanitized class names collide.

  - id: shape
    title: Structural Container Shapes
    rules:
      - id: R-SHAPE-STRUCT-CLASS
        statement: |
          A nested `pa.struct([...])` with at least one child field emits a `ClassDefinition` named
          `<OwnerClass>_<field_name>` (sanitized and deduplicated) and sets the parent slot's `range` to that
          class name. An empty nested `pa.struct([])` raises **E2**.
      - id: R-SHAPE-LIST-SLOT
        statement: |
          Variable-length Arrow list types (`pa.list_`, `pa.large_list`, `pa.list_view`, `pa.large_list_view`)
          emit a single `SlotDefinition` with `multivalued: true` and the `range` of the inner element type
          (omitting scalar `minimum_value`/`maximum_value` so LinkML's Pydantic codegen does not apply numeric
          bounds to the outer list container), generating an element `ClassDefinition` when the element is a
          `pa.struct`.
      - id: R-SHAPE-FIXED-LIST-CARDINALITY
        statement: |
          Fixed-length `pa.list_(item, list_size)` (`pa.FixedSizeListType`) emits a multivalued `SlotDefinition`
          (`multivalued: true`) with `minimum_cardinality: list_size` and `maximum_cardinality: list_size`.
      - id: R-SHAPE-MAP-CLASS
        statement: |
          `pa.map_(key_type, item_type)` emits an entry `ClassDefinition` named `<OwnerClass>_<field_name>_map`
          with attributes `key` and `value`, and sets the map slot to `range: <OwnerClass>_<field_name>_map` and
          `multivalued: true`.
      - id: R-SHAPE-DICTIONARY
        statement: |
          `pa.dictionary(index_type, value_type, ordered=...)` unwraps to the LinkML `range` and integer bounds
          of `value_type`.
      - id: R-REJECT-NESTED-MULTIVALUED
        statement: |
          Because LinkML represents list multiplicity via a flat `multivalued: true` flag on a slot rather than
          nested array containers, directly nested lists (`list<list<...>>`) and lists of maps (`list<map<...>>`)
          raise **E10**. Nested collections wrapped inside an intermediate `pa.struct` (`list<struct<...>>`) are
          supported via the struct's `ClassDefinition`.

  - id: nullability
    title: Requiredness and List Element Constraints
    rules:
      - id: R-NULL-REQUIRED
        statement: |
          A field with `pa.Field.nullable == False` sets `required: true` on its `SlotDefinition`.
      - id: R-NULL-OPTIONAL
        statement: |
          A field with `pa.Field.nullable == True` omits `required` (leaving the LinkML slot optional).
          Standalone `pa.null()` columns or element types have no value domain and raise **E4**.
      - id: R-NULL-MAP-VALUE
        statement: |
          Inside a generated `<OwnerClass>_<field_name>_map` entry class, `key` always carries `required: true`;
          `value` carries `required: true` when `MapType.item_field.nullable == False` and omits `required` when
          `MapType.item_field.nullable == True`.
      - id: R-LIST-NON-NULL-ITEMS
        statement: |
          LinkML multivalued slots represent lists of non-null domain values: `serialize_table_for_linkml` and
          `serialize_record_for_linkml` reject `null` elements inside populated list values with `ValueError`
          while permitting `null` (`None`) on optional outer list slots.

  - id: scalars
    title: Scalar Ranges and Integer Bounds
    generated: scalar_table
    rules:
      - id: R-SCALAR-BOOL
        statement: |
          `pa.bool_()` maps to `range: boolean`.
      - id: R-SCALAR-SIGNED-INT
        statement: |
          Single-valued signed integer slots (`int8`, `int16`, `int32`, `int64`) map to `range: integer` with
          `minimum_value: -2^(w-1)` and `maximum_value: 2^(w-1) - 1` for bit width `w` (multivalued integer
          list slots omit `minimum_value`/`maximum_value`; see [R-SHAPE-LIST-SLOT](#r-shape-list-slot)).
      - id: R-SCALAR-UNSIGNED-INT
        statement: |
          Single-valued unsigned integer slots (`uint8`, `uint16`, `uint32`, `uint64`) map to `range: integer`
          with `minimum_value: 0` and `maximum_value: 2^w - 1` for bit width `w` (multivalued integer list
          slots omit `minimum_value`/`maximum_value`; see [R-SHAPE-LIST-SLOT](#r-shape-list-slot)).
      - id: R-SCALAR-FLOAT
        statement: |
          IEEE-754 floating-point types (`float16`, `float32`, `float64`) map to `range: float`.
      - id: R-SCALAR-DECIMAL
        statement: |
          `pa.decimal128(p, s)` and `pa.decimal256(p, s)` with `0 <= s <= p` map to `range: decimal`. Decimals
          with `s < 0` or `s > p` raise **E5**.
      - id: R-SCALAR-STRING-BINARY
        statement: |
          UTF-8 string types (`string`, `large_string`, `string_view`) and Base64-serialized binary types
          (`binary`, `large_binary`, `binary_view`, `fixed_size_binary(n)`) map to `range: string`.
      - id: R-SCALAR-TEMPORAL
        statement: |
          `date32` and `date64` map to `range: date`; `time32` and `time64` map to `range: time`; both
          timezone-aware and timezone-naive `pa.timestamp` types map to `range: datetime`. Relative durations
          and calendar intervals (`pa.duration`, `pa.month_day_nano_interval`) raise **E6**; Arrow unions raise
          **E7**; `run_end_encoded` and `BaseExtensionType` types (`pa.uuid()`, custom `ExtensionType`) raise
          **E8**.

  - id: metadata
    title: Schema and Slot Descriptions
    rules:
      - id: R-META-SCHEMA-DESC
        statement: |
          Non-empty UTF-8 `schema.metadata[b"comment"]` on a `pa.Schema` is emitted as
          `SchemaDefinition.description` (and as the root `ClassDefinition.description` when appended into an
          existing schema via `destination`).
      - id: R-META-SLOT-DESC
        statement: |
          Non-empty UTF-8 `pa.Field.metadata[b"comment"]` on a root or struct field is emitted as
          `SlotDefinition.description` (falling back to inner list element `comment` when the outer field has no
          `comment`).

  - id: serialization
    title: Arrow Table and Record Serialization
    rules:
      - id: R-SER-ROW-ORDER
        statement: |
          `serialize_table_for_linkml` and `serialize_record_for_linkml` emit one JSON-compatible dictionary per
          row with keys in `pa.Schema` declaration order; null Arrow scalars on optional slots serialize as
          `null` (`None`), structs serialize as nested dicts, lists serialize as JSON arrays, and dictionary
          scalars unwrap to their decoded value.
      - id: R-SER-DECIMAL-STR
        statement: |
          `decimal128` and `decimal256` scalars serialize via plain fixed-point formatting (`format(value, "f")`,
          never scientific notation) matching LinkML's `decimal` scalar type.
      - id: R-SER-BASE64
        statement: |
          `binary`, `large_binary`, `binary_view`, and `fixed_size_binary(n)` scalars serialize to ASCII Base64
          strings.
      - id: R-SER-TEMPORAL-ISO
        statement: |
          `date32` and `date64` serialize as `YYYY-MM-DD`; `time32` and `time64` serialize as
          `HH:MM:SS[.fffffffff]`; timezone-aware and timezone-naive `timestamp` scalars serialize via ISO-8601
          `isoformat()`.
      - id: R-SER-MAP-ENTRIES
        statement: |
          `pa.map_` scalars serialize as `[{"key": <serialized key>, "value": <serialized value>}, ...]`
          matching the generated `<OwnerClass>_<field_name>_map` entry class attributes.
      - id: R-SER-FINITE-FLOAT
        statement: |
          Finite `float16`, `float32`, and `float64` scalars serialize as JSON `float` numbers; non-finite
          `NaN` or `±Infinity` values raise `ValueError`.
