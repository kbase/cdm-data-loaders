title: Strings, Base64 Binary Columns, and Fixed-Point Decimals
rules:
  - R-SCALAR-STRING-BINARY
  - R-SCALAR-DECIMAL
  - R-NULL-REQUIRED
  - R-NULL-OPTIONAL
  - R-SER-ROW-ORDER
