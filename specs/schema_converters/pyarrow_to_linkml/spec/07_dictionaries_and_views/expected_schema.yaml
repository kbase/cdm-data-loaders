    prefix_prefix: CatalogViewRecord
    prefix_reference: urn:linkml:CatalogViewRecord#
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
default_prefix: CatalogViewRecord
classes:
  CatalogViewRecord:
    name: CatalogViewRecord
    attributes:
      id:
