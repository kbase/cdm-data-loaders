# Rule catalogue for the JSON Schema -> PyArrow converter
# (cdm_data_loaders.converters.jsonschema_to_pyarrow: generate_pyarrow_schema / coerce_record_for_pyarrow).
#
# This file and the per-case `case.yaml` manifests are the single source of truth for
# docs/jsonschema_to_pyarrow_specification.md, generated by scripts/gen_converter_spec.py.
# Every rule must be exercised by at least one case (enforced by test_jsonschema_to_pyarrow_spec.py).
title: JSON Schema (Draft 2020-12) to PyArrow Specification
intro: |
  This document specifies how a **JSON Schema Draft 2020-12** document determines:

  1. The **PyArrow `pa.Schema`** produced by `generate_pyarrow_schema`.
  2. The **Python row dictionaries** produced by `coerce_record_for_pyarrow` from schema-valid JSON records,
     ready for `pa.Table.from_pylist(rows, schema=pa_schema)` and Parquet serialization.
  3. The **errors** raised for constructs that cannot be represented as a static columnar schema.

sections:
  - id: resolution
    title: Top-Level Resolution and Unwrapping
    rules:
      - id: R-DIALECT
        statement: |
          The root must declare `"$schema": "https://json-schema.org/draft/2020-12/schema"` or the KBase
          XSV metaschema `"https://json-schema.kbase.us/draft/2020-12-xsv/schema"`; anything else raises **E1**.
      - id: R-ROOT-REF
        statement: |
          A root consisting of `"$ref": "#/$defs/<Name>"` (without its own `properties`) is replaced by the
          referenced definition before classification. That definition counts as one expansion for recursion.
      - id: R-UNWRAP
        statement: |
          The resolved root must be a fixed-property object producing at least one field. Its fields become
          the top-level columns. A scalar, array or pure-map root raises **E2**; an object with no fields raises
          **E3**.

  - id: naming
    title: Naming and Field Ordering
    rules:
      - id: R-NAME-PROPERTY
        statement: |
          Property keys are used verbatim as field names.
      - id: R-ORDER
        statement: |
          Struct fields are emitted in this order: properties from each `allOf` subschema in list order, then
          direct `properties` in declaration order, then properties contributed by `anyOf`, `oneOf`,
          `dependentSchemas`, `then` and `else`. A property seen more than once keeps the position of its
          first occurrence.
      - id: R-MERGE-DUPLICATE
        statement: |
          When a property is declared more than once (across `allOf`, `anyOf`/`oneOf`, `dependentSchemas` or
          `then`/`else`), identical declarations collapse to one; differing declarations are combined as an
          `anyOf` of the declarations and resolved with the union rules ([R-UNION-SCALAR](#r-union-scalar),
          [R-UNION-OBJECT](#r-union-object)). The first declared `description` is kept.

  - id: shape
    title: Construct Classification (Shape)
    rules:
      - id: R-SHAPE-OBJECT
        statement: |
          An object with `properties` (or object combinators) maps to `pa.struct([...])`. Boolean
          `additionalProperties` (`true`, `false` or omitted) on such an object is ignored.
      - id: R-SHAPE-ARRAY
        statement: |
          `type: "array"` with `items: <schema>` maps to `pa.list_(pa.field("item", <item type>))`; nested
          arrays nest lists.
      - id: R-SHAPE-TUPLE
        statement: |
          A closed tuple (`prefixItems: [S_0, ..., S_k-1]` with `items` `false` or omitted) maps to
          `pa.struct` with fields `item_0` ... `item_k-1`. Any other `items` value raises **E5**.
      - id: R-SHAPE-MAP
        statement: |
          An object with schema-valued `additionalProperties` and/or `patternProperties` and no fixed
          properties maps to `pa.map_(pa.string(), pa.field("value", <value type>))`. Several value schemas are
          combined with the union rules. Mixing fixed properties with a map schema raises **E6**.
      - id: R-SHAPE-REF
        statement: |
          `"$ref": "#/$defs/<Name>"` is replaced by the definition; sibling keywords on the referencing node
          are overlaid on the definition. Only local `#/$defs/` pointers are supported (**E9**).
      - id: R-RECURSION
        statement: |
          Each `$defs` target may be expanded at most `max_recursion_depth` times (default `2`) along a path.
          A deeper reference becomes `pa.string()` (or `pa.list_(pa.string())` inside an array), carries no
          `jsonschema_type`, and its runtime value is serialized with `json.dumps`. Applies to self-recursion
          and mutual recursion.

  - id: nullability
    title: Field Nullability
    rules:
      - id: R-NULL-REQUIRED
        statement: |
          A property field is `nullable=False` only when it is in the enclosing object's effective `required`
          set and its schema does not allow `null`. The effective `required` set is the union of `required`
          across the object and its `allOf` subschemas, plus the intersection of `required` across
          `anyOf`/`oneOf` object branches.
      - id: R-NULL-ALLOWS-NULL
        statement: |
          A schema allows `null` when `"null"` is in `type`, `null` is in `enum` or is the `const`, or any
          `anyOf`/`oneOf`/`allOf` branch (or `$ref` target) allows `null`. Such fields are `nullable=True` even
          when required.
      - id: R-NULL-CONDITIONAL
        statement: |
          Properties introduced only by `dependentSchemas`, `then` or `else` are `nullable=True`;
          `dependentRequired` does not affect nullability.
      - id: R-NULL-DEFAULT
        statement: |
          `default` is an annotation only: it neither changes nullability nor fills in missing values.
      - id: R-NULL-ITEMS
        statement: |
          A list `item` field and a map `value` field are `nullable=False` unless the item/value schema allows
          `null`. A tuple field `item_i` is `nullable=False` only when `minItems >= i + 1` and `prefixItems[i]`
          does not allow `null`.

  - id: scalars
    title: Scalar Types and Unions
    generated: scalar_table
    rules:
      - id: R-SCALAR-TYPE
        statement: |
          Scalar `type`, `format` and `contentEncoding` map to Arrow types per the table below. Numeric
          validation keywords (`minimum`, `maximum`, `exclusiveMinimum`, `exclusiveMaximum`, `multipleOf`) do
          not change the type. Only `format: "date"` becomes a temporal type; other formats stay `pa.string()`.
      - id: R-SCALAR-ENUM-CONST
        statement: |
          With an explicit `type`, `enum`/`const` use that type. Without one, each non-null literal's type is
          inferred (`bool` -> boolean, `int` -> integer, `float` -> number, `str` -> string) and combined with
          the union rules.
      - id: R-UNION-SCALAR
        statement: |
          For `type: [...]` and scalar-only `anyOf`/`oneOf`, `null` members are dropped (making the field
          nullable). If the rest share one Arrow type it is used; if they are only `integer` and `number` the
          type is `pa.float64()`; otherwise `pa.string()`. `jsonschema_type` joins the distinct member labels
          with `" | "` in declaration order. `object` or `array` in a `type` list raises **E8**.
      - id: R-UNION-OBJECT
        statement: |
          `anyOf`/`oneOf` whose non-null branches are all objects merge their properties into one struct.
          Branches of other structural shapes (array, map) raise **E8**.
      - id: R-UNION-SCALAR-OBJECT
        statement: |
          `anyOf`/`oneOf` mixing object and scalar branches yields a struct of the merged object properties,
          all `nullable=True`, followed by a synthesized `_value` field holding the unified scalar type. A
          declared `_value` property raises **E12**.

  - id: metadata
    title: Field Metadata
    rules:
      - id: R-META-JSONSCHEMA-TYPE
        statement: |
          Every scalar field (including scalar list `item`, map `value` and tuple `item_i` fields) carries
          `metadata["jsonschema_type"]`. Struct, list, map and recursion-truncated fields do not.
      - id: R-META-COMMENT
        statement: |
          A non-empty `description` is stored in `metadata["comment"]`. If the node has none, it is inherited
          from its `$ref` target, or from the only non-null `$ref` branch of an `anyOf`/`oneOf`.

  - id: coercion
    title: Record Coercion
    rules:
      - id: R-COERCE-SCALAR
        statement: |
          Strings for `pa.date32()` are parsed with `datetime.date.fromisoformat`; `pa.binary()` strings are
          decoded as Base16 (`bytes.fromhex`) when `jsonschema_type` mentions `base16`, otherwise Base64. Ints
          become floats for float fields, and integral floats become ints for integer fields.
      - id: R-COERCE-STRING-FALLBACK
        statement: |
          Non-string values written to a `pa.string()` field are stringified: booleans, objects and arrays with
          `json.dumps` (`true`/`false`), numbers with `str()`. This covers heterogeneous scalar unions and
          recursion-truncated subtrees.
      - id: R-COERCE-TUPLE
        statement: |
          A JSON array for a closed tuple becomes `{"item_0": v_0, ...}`; positions that are missing or `null`
          are omitted.
      - id: R-COERCE-VALUE
        statement: |
          A scalar written to a scalar + object union struct becomes `{"_value": <coerced scalar>}`.
      - id: R-COERCE-SPARSE
        statement: |
          Only keys declared in the schema are kept; absent keys stay absent (they become null in the table).
