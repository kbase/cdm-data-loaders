    data: minimal.json
    expected_json: minimal_expected.json
    expected_table: minimal_expected_table.py
    expected_count: 1
  - id: maximal
    data: maximal.json
    expected_json: maximal_expected.json
    expected_table: maximal_expected_table.py
    expected_count: 1
