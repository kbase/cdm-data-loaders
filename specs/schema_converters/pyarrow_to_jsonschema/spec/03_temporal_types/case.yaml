title: Dates, Times, and Timezone-Aware vs Timezone-Naive Timestamps
rules:
  - R-SCALAR-DATE-TIME
  - R-SCALAR-TIMESTAMP
  - R-NULL-REQUIRED
  - R-NULL-OPTIONAL
  - R-META-X-PYARROW-TYPE
  - R-SER-ROW-ORDER
  - R-SER-TEMPORAL-ISO
notes: |
  Covers `date32`, `date64`, `time32("s"|"ms")`, `time64("us"|"ns")` (including sub-microsecond nanoseconds),
  timezone-aware `timestamp` across units (`s`, `ms`, `us`, `ns`) and IANA/UTC zones (`"format": "date-time"`),
  and timezone-naive `timestamp` (`logical_type: "timestamp-without-tz"` without `"format": "date-time"`).
schema: schema.py
expected_schema: expected_schema.json
runs:
  - id: default
    data: table.py
    expected_json: expected.json
    expected_table: table.py
    schema_attr: SCHEMA
    table_attr: TABLE
    expected_count: 2
