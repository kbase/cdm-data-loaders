name: Run tests
permissions:
  contents: read

on:
  workflow_call:

  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  code_format_and_lint:
    name: Check code formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run code formatting checks
        shell: bash
        run: uv run ruff format --check

      - name: Run code linting checks
        continue-on-error: true
        run: uv run ruff check --output-format=github .

  container_tests:
    name: Run container tests (${{ matrix.suite.name }})
    needs: code_format_and_lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: pipelines
            args: tests/cdm_data_loaders/pipelines/
          - name: integration
            args: tests/integration/
          - name: everything else
            args: --ignore=tests/integration --ignore=tests/cdm_data_loaders/pipelines

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run container tests
        shell: bash
        continue-on-error: false
        run: |
          docker build -t cdm-data-loaders-test:latest .
          echo "Running tests inside container..."
          # slightly nasty hack
          chmod 777 .
          docker run --rm -v .:/out cdm-data-loaders-test:latest test --cov-report=xml:/out/coverage.xml --junitxml=/out/junit.xml -o junit_family=legacy ${{ matrix.suite.args }}

      - name: Send coverage to Codecov
        id: upload_coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Send test reports to Codecov
        id: upload_test_reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

  docker_tests:
    name: Run docker pipeline tests
    runs-on: ubuntu-24.04
    needs: code_format_and_lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run docker pipeline tests
        shell: bash
        continue-on-error: false
        run: uv run pytest --run-docker -m "docker and not requires_spark and not requires_ceph" --cov --junitxml=junit.xml -o junit_family=legacy tests/cdm_data_loaders/pipelines/

      - name: Send test reports to Codecov
        id: upload_test_reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

  tests:
    name: Run local tests (${{ matrix.suite.name }}, ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: code_format_and_lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        os: ["ubuntu-24.04"]
        suite:
          - name: pipelines
            args: tests/cdm_data_loaders/pipelines/
          - name: integration
            args: tests/integration/
          - name: everything else
            args: --ignore=tests/integration --ignore=tests/cdm_data_loaders/pipelines

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run local tests
        shell: bash
        continue-on-error: false
        run: uv run pytest -m "not requires_spark and not requires_ceph" --cov --junitxml=junit.xml -o junit_family=legacy ${{matrix.suite.args}}

      - name: Send test reports to Codecov
        id: upload_test_reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
