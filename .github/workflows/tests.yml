name: Run tests
permissions:
  contents: read

on:
  workflow_call:

  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code_format_and_lint:
    name: Check code formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run code formatting checks
        shell: bash
        run: uv run ruff format --check

      - name: Run code linting checks
        continue-on-error: true
        run: uv run ruff check --output-format=github .

  container_tests:
    name: Run container tests (${{ matrix.suite.name }})
    needs: code_format_and_lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: pipelines
            args: tests/cdm_data_loaders/pipelines/
          - name: integration
            args: tests/integration/
          - name: everything else
            args: --ignore=tests/integration --ignore=tests/cdm_data_loaders/pipelines

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run container tests
        shell: bash
        continue-on-error: false
        run: |
          docker build -t cdm-data-loaders-test:latest .
          echo "Running tests inside container..."
          # slightly nasty hack
          chmod 777 .
          docker run --rm -v .:/out cdm-data-loaders-test:latest test --cov-report=xml:/out/coverage.xml --junitxml=/out/junit.xml -o junit_family=legacy ${{ matrix.suite.args }}

      - name: Send coverage to Codecov
        id: upload_coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Send test reports to Codecov
        id: upload_test_reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

  tests:
    name: Run local tests (${{ matrix.suite.name }}, ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: code_format_and_lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        os: ["ubuntu-latest"]
        suite:
          - name: pipelines
            args: tests/cdm_data_loaders/pipelines/
          - name: integration
            args: tests/integration/
          - name: everything else
            args: --ignore=tests/integration --ignore=tests/cdm_data_loaders/pipelines

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Install qsv
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$(uname -s)" in
            Linux)
              OS_TARGET="unknown-linux-gnu"
              if command -v dpkg-query >/dev/null 2>&1 && ! dpkg-query -W -f='${db:Status-Status}' libwayland-client0 2>/dev/null | grep -qx installed; then
                sudo apt-get update -y
                sudo apt-get install -y --no-install-recommends libwayland-client0
              fi
              ;;
            Darwin)
              OS_TARGET="apple-darwin"
              ;;
            *)
              echo "Unsupported OS: $(uname -s)" >&2
              exit 1
              ;;
          esac
          case "$(uname -m)" in
            x86_64) ARCH="x86_64" ;;
            aarch64|arm64) ARCH="aarch64" ;;
            *)
              echo "Unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          QSV_VERSION=$(gh release view --repo dathere/qsv --json tagName --jq .tagName)
          ASSET="qsv-${QSV_VERSION#v}-${ARCH}-${OS_TARGET}.zip"
          gh release download "${QSV_VERSION}" --repo dathere/qsv --pattern "${ASSET}" --dir "${RUNNER_TEMP}" --clobber
          unzip -q -o "${RUNNER_TEMP}/${ASSET}" qsv -d "${RUNNER_TEMP}/qsv"
          sudo install -m 0755 "${RUNNER_TEMP}/qsv/qsv" /usr/local/bin/qsv
          rm -rf "${RUNNER_TEMP}/qsv" "${RUNNER_TEMP}/${ASSET}"
          qsv --version

      - name: Run local tests
        shell: bash
        continue-on-error: false
        run: uv run pytest -m "not requires_spark and not requires_ceph and not docs" --cov --junitxml=junit.xml -o junit_family=legacy ${{matrix.suite.args}}

      - name: Send test reports to Codecov
        id: upload_test_reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
