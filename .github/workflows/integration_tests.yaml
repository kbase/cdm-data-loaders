name: CEPH Integration tests

on:
    workflow_call:

    push:
        branches:
            - main
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ceph_integration_tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Run CEPH-backed integration tests
              env:
                  PYTEST_ADDOPTS: "--durations=0 --durations-min=5"
              run: |
                  docker compose -f docker-compose.lakehouse.yml up -d --build
                  docker compose -f docker-compose.lakehouse.yml exec -T cdm-data-loaders pytest -m "requires_ceph" -v

            - name: Capture compose diagnostics on failure
              if: failure()
              run: |
                  echo "=== docker compose ps ==="
                  docker compose -f docker-compose.lakehouse.yml ps -a || true

                  echo "=== ceph logs ==="
                  docker compose -f docker-compose.lakehouse.yml logs ceph || true

                  echo "=== cdm-data-loaders logs ==="
                  docker compose -f docker-compose.lakehouse.yml logs cdm-data-loaders || true

            - name: Tear down
              if: always()
              run: docker compose -f docker-compose.lakehouse.yml down --volumes
