# This is boilerplate for publishing a Docker image via Github Actions.

name: Docker workflows

on:
    workflow_call:

    push:
        branches:
            - main
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review
    release:
        types: [published]

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}
    TEST_TAG: test_container

jobs:
    build_test_push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Login to GitHub Container Registry
              uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6

              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

            - name: Extract Docker metadata
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
              id: meta
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

            - name: Build test Docker image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
              id: build-test-image
              with:
                  context: .
                  load: true
                  tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TEST_TAG }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Run non-spark tests on the built image
              id: run-tests-docker
              continue-on-error: true
              run: |
                  docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TEST_TAG }} test

            - name: Build and push
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
              id: build-push-image
              if: ${{ github.event_name == 'release' || github.event_name == 'push' }}
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  platforms: linux/amd64,linux/arm64/v8
