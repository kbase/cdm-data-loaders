[project]
name = "cdm-data-loaders"
version = "0.1.10"
description = "Data loaders and wranglers for the CDM."
requires-python = ">= 3.13"
readme = "README.md"
authors = [
    {name = "KBase developers", email = "engage@kbase.us"},
]

dependencies = [
    "beautifulsoup4>=4.15.0",
    "bioregistry>=0.13.58",
    "boto3[crt]>=1.43.0",
    "click>=8.4.1",
    "defusedxml>=0.7.1",
    "delta-spark>=4.2.0",
    "dlt[deltalake,duckdb,filesystem,parquet,pyiceberg]>=1.30.0",
    "frictionless[aws]>=5.19.0",
    "frozendict>=2.4.7",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "jsonschema[format]>=4.26.0",
    "lxml>=6.1.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyiceberg>=0.11.1",
    "smart-open>=8.0.1",
    "tqdm>=4.67.3",
    "xmlschema>=4.3.1",
    "xmltodict>=1.0.4",
]

[project.scripts]
all_the_bacteria = "cdm_data_loaders.pipelines.all_the_bacteria:cli"
ncbi_ftp_promote = "cdm_data_loaders.pipelines.ncbi_ftp_promote:cli"
ncbi_ftp_sync = "cdm_data_loaders.pipelines.ncbi_ftp_download:cli"
ncbi_rest_api = "cdm_data_loaders.pipelines.ncbi_rest_api:cli"
pdb_manifest = "cdm_data_loaders.pipelines.pdb_manifest:cli"
uniprot = "cdm_data_loaders.pipelines.uniprot_kb:cli"
uniref = "cdm_data_loaders.pipelines.uniref:cli"

[dependency-groups]
dev = [
    "moto[s3]>=5.2.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.6.0",
    "pytest-recording>=0.13.4",
    "ruff>=0.15.14",
    "types-boto3[s3]>=1.43.62",
]
lakehouse = [
    "berdl-notebook-utils",
    "cdm-task-service-client>=0.2.1",
]
models = [
    "genson>=1.3.0",
    "json2python-models>=0.3.1",
]
xml = [
    "xsdata[cli,lxml]>=26.2",
]

[project.optional-dependencies]

[tool.ruff]
line-length = 100
target-version = "py313"
# Exclude a variety of commonly ignored directories.
exclude = [
    "__pypackages__",
    "_build",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git-rewrite",
    ".git",
    ".github",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "*.pyc",
    "buck-out",
    "build",
    "deps",
    "dist",
    "node_modules",
    "python-coverage",
    "venv",
]

[tool.ruff.lint]
select = [
    # core
    "F", # Pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "C90", # mccabe +
    "I", # isort
    "N", # pep8-naming
    "D", # pydocstyle
    "UP", # pyupgrade
    # extensions
    "YTT", # flake8-2020
    "ANN", # flake8-annotations
    "ASYNC", # flake8-async
    "S", # flake8-bandit
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "B", # flake8-bugbear
    "A", # flake8-builtins
    # "COM", # flake8-commas
    # "CPY", # flake8-copyright
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "DJ", # flake8-django
    "EM", # flake8-errmsg
    "EXE", # flake8-executable
    "FA", # flake8-future-annotations
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G", # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT", # flake8-pytest-style
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SLOT", # flake8-slots
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TC", # flake8-type-checking
    "INT", # flake8-gettext
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "TD", # flake8-todos
    "FIX", # flake8-fixme
    "ERA", # eradicate
    "PD", # pandas-vet
    "PGH", # pygrep-hooks
    "PL", # Pylint
    "TRY", # tryceratops
    "FLY", # flynt
    "NPY", # NumPy-specific rules
    "AIR", # Airflow
    "PERF", # Perflint
    "FURB", # refurb
    "LOG", # flake8-logging
    "RUF", # Ruff-specific rules
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]

ignore = [
    # D200: unnecessary-multiline-docstring
    "D200",
    # D203: one-blank-line-before-class (conflicts with D211)
    "D203",
    # D212: multi-line-summary-first-line (conflicts with D213)
    "D212",
    # E203: whitespace before ',', ';', or ':'
    "E203",
    # E501: line length (specified elsewhere)
    "E501",
    # ISC001: conflicts with Ruff's formatter
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["T201"] # ignore printing in notebooks
"**/__init__.py" = ["D104"] # no docstrings for __init__ files
"scripts/**/*.py" = ["T201"] # ignore printing in scripts
# S101: use of assert
# T201: print statements
# FBT001, FBT002: booleans as args
# ANN401: type annotations
# ARG002: unused mock args
# PLR0913: too many arguments
"tests/**/*.py" = ["S101", "T201", "FBT001", "FBT002", "ARG002", "PLR0913"]
"tests/integration/**/*.py" = ["S101", "T201", "FBT001", "FBT002", "ARG002", "ANN401"]
"tests/utils/test_s3.py" = ["ANN401"]

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 15.
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["uv_build>=0.12.0,<0.20.0"]
build-backend = "uv_build"

[tool.pytest]
pythonpath = ["src"]
log_cli = true
log_cli_level = "INFO"
log_level = "INFO"
addopts = ["-v"]
markers = [
    "requires_spark: must be run in an environment where spark is available",
    "s3: tests that mock s3 interactions",
    "slow_test: does what it says on the tin",
    "requires_ceph: end-to-end tests requiring a running CEPH instance and network access",
    "external_request: tests that make real network requests to external services (e.g. NCBI FTP)",
    "requires_xsv: tests that use the xsv-validate.sh tool",
    "settings_cls(cls): the pydantic-settings class under test for alias parametrization",    
]

# environment settings for running tests
[tool.pytest_env]
USER = "fake_user"
KBASE_AUTH_TOKEN = "test-token-123"
CDM_TASK_SERVICE_URL = "http://localhost:8080"
BERDL_POD_IP = "192.168.1.100"
SPARK_MASTER_URL = "spark://localhost:7077"
BERDL_HIVE_METASTORE_URI = "thrift://localhost:9083"
SPARK_CLUSTER_MANAGER_API_URL = "http://localhost:8000"
GOVERNANCE_API_URL = "http://localhost:8000"
DATALAKE_MCP_SERVER_URL = "http://localhost:8080"
S3_ENDPOINT_URL = "http://localhost:9000"
# aws config settings
AWS_CONFIG_FILE = "/dev/null"  # ensure tests don't pick up creds from a real config file
AWS_DEFAULT_REGION = "us-east-1"
# default to use containerized S3 test store
AWS_ENDPOINT_URL = { value = "http://localhost:9000", skip_if_set = true }
AWS_ENDPOINT_URL_S3 = { unset = true }
AWS_ACCESS_KEY_ID = "test_access_key"
AWS_SECRET_ACCESS_KEY = "test_access_secret"

[tool.uv.sources]
cdm-schema = { git = "https://github.com/kbase/cdm-schema.git" }
berdl-notebook-utils = { git = "https://github.com/KBaseDataLakehouse/spark_notebook.git", subdirectory = "notebook_utils" }
cdm-task-service-client = { git = "https://github.com/kbase/cdm-task-service-client.git" }
