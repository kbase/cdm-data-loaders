[project]
name = "cdm-data-loaders"
version = "0.1.12"
description = "Data loaders and wranglers for the CDM."
requires-python = ">= 3.13"
readme = "README.md"
authors = [
    {name = "KBase developers", email = "engage@kbase.us"},
]

dependencies = [
    "bioregistry>=0.15.10",
    "boto3[crt]>=1.43.117",
    "defusedxml>=0.7.1",
    "delta-spark>=4.4.1",
    "dlt[duckdb,filesystem,parquet,pyiceberg]>=1.32.0",
    "frictionless[aws]>=5.21.0",
    "frozendict>=2.5.1",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jsonschema[format]>=4.26.0",
    "linkml>=1.12.1",
    "linkml-runtime>=1.12.1",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyiceberg[pandas,pyarrow,pyiceberg-core,snappy]>=0.12.0",
    "smart-open>=9.0.2",
    "tqdm>=4.70.1",
    "xmlschema>=4.3.2",
    "xmltodict>=1.0.4",
]

[project.scripts]
all_the_bacteria = "cdm_data_loaders.pipelines.all_the_bacteria:cli"
jsonlines_extract = "cdm_data_loaders.pipelines.jsonlines.extract_pipeline:cli"
jsonlines_jsonschema = "cdm_data_loaders.pipelines.jsonlines.extract_jsonschema_validate_pipeline:cli"
jsonlines_pydantic = "cdm_data_loaders.pipelines.jsonlines.extract_pydantic_validate_pipeline:cli"
ncbi_ftp_promote = "cdm_data_loaders.pipelines.ncbi_ftp_promote:cli"
ncbi_ftp_sync = "cdm_data_loaders.pipelines.ncbi_ftp_download:cli"
ncbi_rest_api = "cdm_data_loaders.pipelines.ncbi_rest_api:cli"
pubmed = "cdm_data_loaders.pipelines.xmltopyarrow.pipeline:pubmed_cli"
uniprot = "cdm_data_loaders.pipelines.xmltopyarrow.pipeline:uniprot_cli"
uniprot_cdm = "cdm_data_loaders.pipelines.uniprot_kb_cdm:cli"
uniref50 = "cdm_data_loaders.pipelines.xmltopyarrow.pipeline:uniref50_cli"
uniref50_cdm = "cdm_data_loaders.pipelines.uniref_cdm:uniref50_cdm_cli"
uniref90 = "cdm_data_loaders.pipelines.xmltopyarrow.pipeline:uniref90_cli"
uniref90_cdm = "cdm_data_loaders.pipelines.uniref_cdm:uniref90_cdm_cli"
uniref100 = "cdm_data_loaders.pipelines.xmltopyarrow.pipeline:uniref100_cli"
uniref100_cdm = "cdm_data_loaders.pipelines.uniref_cdm:uniref100_cdm_cli"
xmltodict = "cdm_data_loaders.pipelines.xmltodict.pipeline:cli"
xmltopyarrow = "cdm_data_loaders.pipelines.xmltopyarrow.pipeline:cli"
xsv = "cdm_data_loaders.pipelines.xsv.pipeline:cli"

[dependency-groups]
dev = [
    "moto[s3,server]>=5.2.5",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.8.5",
    "pytest-randomly>=5.0.0",
    "pytest-recording>=0.14.1",
    "ruff>=0.17.4",
    "types-boto3[s3]>=1.43.125",
]
lakehouse = [
    "cdm-task-service-client",
]
models = [
    "datamodel-code-generator>=0.90.0",
    "genson>=1.4.0",
    "json2python-models>=0.3.1",
]
mutants = [
    "mutmut>=3.8.1",
]
docs = [
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.8.0",
    "mkdocstrings[python]>=1.0.8",
]

[tool.ruff]
line-length = 120
target-version = "py313"
# Exclude a variety of commonly ignored directories.
exclude = [
    "__pypackages__",
    "_build",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git-rewrite",
    ".git",
    ".github",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "*.pyc",
    "buck-out",
    "build",
    "deps",
    "dist",
    "node_modules",
    "python-coverage",
    "venv",
]

[tool.ruff.lint]
select = [
    # core
    "F", # Pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "C90", # mccabe +
    "I", # isort
    "N", # pep8-naming
    "D", # pydocstyle
    "UP", # pyupgrade
    # extensions
    "YTT", # flake8-2020
    "ANN", # flake8-annotations
    "ASYNC", # flake8-async
    "S", # flake8-bandit
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "B", # flake8-bugbear
    "A", # flake8-builtins
    # "COM", # flake8-commas
    # "CPY", # flake8-copyright
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "DJ", # flake8-django
    "EM", # flake8-errmsg
    "EXE", # flake8-executable
    "FA", # flake8-future-annotations
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G", # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT", # flake8-pytest-style
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SLOT", # flake8-slots
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TC", # flake8-type-checking
    "INT", # flake8-gettext
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "TD", # flake8-todos
    "FIX", # flake8-fixme
    "ERA", # eradicate
    "PD", # pandas-vet
    "PGH", # pygrep-hooks
    "PL", # Pylint
    "TRY", # tryceratops
    "FLY", # flynt
    "NPY", # NumPy-specific rules
    "AIR", # Airflow
    "PERF", # Perflint
    "FURB", # refurb
    "LOG", # flake8-logging
    "RUF", # Ruff-specific rules
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]

ignore = [
    # D200: unnecessary-multiline-docstring
    "D200",
    # D203: one-blank-line-before-class (conflicts with D211)
    "D203",
    # D212: multi-line-summary-first-line (conflicts with D213)
    "D213",
    # E203: whitespace before ',', ';', or ':'
    "E203",
    # E501: line length (specified elsewhere)
    "E501",
    # ISC001: conflicts with Ruff's formatter
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["T201"] # ignore printing in notebooks
"**/__init__.py" = ["D104"] # no docstrings for __init__ files
"scripts/**/*.py" = ["T201"] # ignore printing in scripts
# D401: docstrings in imperative mode
# S101: use of assert
# T201: print statements
# FBT001, FBT002: booleans as args
# ANN401: type annotations
# ARG002: unused mock args
# PLR0913: too many arguments
"tests/**/*.py" = ["D401", "S101", "T201", "FBT001", "FBT002", "ARG002", "PLR0913", "PLR0917"]
# specs dorectpry
"specs/**/*.py" = ["INP001", "D101", "D102"]

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 15.
max-complexity = 15

[build-system]
requires = ["uv_build>=0.12.0,<0.20.0"]
build-backend = "uv_build"

[tool.mutmut]
source_paths = [ "src/" ]
pytest_add_cli_args_test_selection= [ "-m", "not requires_spark", "-m", "not slow_test", "-m", "not requires_ceph", "-m", "not external_request", "-m", "not docker", "-m", "not docs", "--ignore", "tests/cdm_data_loaders/pipelines/ncbi_rest_api/test_ncbi_rest_api.py" ]



[tool.pytest]
testpaths = ["tests"]
pythonpath = ["src"]
log_cli = true
log_cli_level = "WARNING"
log_level = "INFO"
addopts = ["-v"]
markers = [
    "requires_spark: must be run in an environment where spark is available",
    "s3: tests that mock s3 interactions",
    "slow_test: does what it says on the tin",
    "requires_ceph: end-to-end tests requiring a running CEPH instance and network access",
    "external_request: tests that make real network requests to external services (e.g. NCBI FTP)",
    "docker: tests that build and run the pipeline inside a Docker container",
    "docs: tests that verify documentation generation and drift across docs/ and README.md",
]

# environment settings for running tests
[tool.pytest_env]
# aws config settings
AWS_CONFIG_FILE = "/dev/null"  # ensure tests don't pick up creds from a real config file
AWS_DEFAULT_REGION = "us-east-1"
# default to use containerized S3 test store
AWS_ENDPOINT_URL = { value = "http://localhost:9000", skip_if_set = true }
AWS_ENDPOINT_URL_S3 = { unset = true }
S3_ENDPOINT_URL = "http://localhost:9000"
AWS_ACCESS_KEY_ID = "test_access_key"
AWS_SECRET_ACCESS_KEY = "test_access_secret"
# required for KBase Lakehouse env
USER = "fake_user"
KBASE_AUTH_TOKEN = "test-token-123"

BERDL_HIVE_METASTORE_URI = "thrift://localhost:9083"
# BERDL_POD_IP = "192.168.1.100"
BERDL_POD_IP = "spark-notebook"
CDM_TASK_SERVICE_URL = "http://localhost:8080"
DATALAKE_MCP_SERVER_URL = "http://localhost:8080"
GOVERNANCE_API_URL = "http://localhost:8000"
POLARIS_CATALOG_URI = "http://polaris:8181/api/catalog"
SPARK_CLUSTER_MANAGER_API_URL = "http://localhost:8000"
SPARK_MASTER_URL = "spark://localhost:7077"
# SPARK_MASTER_URL = "spark://spark-master:7077"
DLT_PROJECT_DIR = "/tmp/dlt"

[tool.uv.sources]
cdm-schema = { git = "https://github.com/kbase/cdm-schema.git" }
cdm-task-service-client = { git = "https://github.com/kbase/cdm-task-service-client.git" }
# berdl-notebook-utils = { git = "https://github.com/KBaseDataLakehouse/spark_notebook.git", subdirectory = "notebook_utils" }
