[project]
site_name = "CDM Data Loaders"
site_description = "Data loaders, schema converters, and ingestion wranglers for the KBase CDM"
site_url = "https://kbase.github.io/cdm-data-loaders/"
repo_url = "https://github.com/kbase/cdm-data-loaders"
repo_name = "kbase/cdm-data-loaders"
nav = [
  { "Home" = "index.md" },
  { "Guides" = [
    { "Core and CTS Execution" = "core_cts_execution.md" },
    { "CLI Reference" = "cli_reference.md" },
    { "Pipeline E2E and Smoke Testing" = "pipeline_e2e_testing_guide.md" },
    { "Pipeline Specifications Guide" = "pipeline_specs_guide.md" },
    { "Schema Converter Specifications Guide" = "schema_converter_specs_guide.md" },
    { "JSONLines Ingestion" = "jsonlines_ingest.md" },
    { "Table and Column Transforms" = "table_transforms.md" },
    { "UniProt and UniRef Ingestion" = "uniprot.md" },
    { "NCBI FTP E2E Walkthrough" = "ncbi_ftp_e2e_walkthrough.md" },
    { "Rclone Bulk Transfer" = "rclone_instructions.md" },
  ] },
  { "Converters and Specifications" = [
    { "Converter IR Architecture" = "converters_ir.md" },
    { "JSON Schema to PyArrow Spec" = "jsonschema_to_pyarrow_specification.md" },
    { "Pydantic to PyArrow Spec" = "pydantic_to_pyarrow_specification.md" },
    { "XSD to PyArrow Spec" = "xsd_to_pyarrow_specification.md" },
    { "PyArrow to JSON Schema Spec" = "pyarrow_to_jsonschema_specification.md" },
    { "PyArrow to LinkML Spec" = "pyarrow_to_linkml_specification.md" },
    { "XSV Schema and Pipeline Spec" = "xsv_specification.md" },
    { "XML to PyArrow Pipeline Spec" = "xmltopyarrow_specification.md" },
    { "XML to Dict Pipeline Spec" = "xmltodict_specification.md" },
    { "JSONLines Extract Pipeline Spec" = "jsonlines_extract_specification.md" },
    { "JSONLines (JSON Schema) Pipeline Spec" = "jsonlines_jsonschema_specification.md" },
    { "JSONLines (Pydantic) Pipeline Spec" = "jsonlines_pydantic_specification.md" },
  ] },
  { "API and Schema Reference" = [
    { "Bundled Schemas and XSDs" = "bundled_schemas.md" },
    { "Schema Source Files" = "schema_source/" },
  ] },
]
watch = ["src/cdm_data_loaders/schemas"]
extra_javascript = [
  "https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js",
  "js/tablesort.js",
]
[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
variant = "modern"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.expand",
  "navigation.indexes",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "search.suggest",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Use system preference"
palette.primary = "teal"
palette.accent = "teal"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[project.plugins.search]

[project.plugins.literate-nav]

[project.plugins.api-autonav]
modules = ["src/cdm_data_loaders"]
api_root_uri = "api"
nav_section_title = "API and Schema Reference"

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "sphinx"
docstring_options = { warnings = false }
heading_level = 2
members_order = "source"
separate_signature = true
show_root_heading = true
show_signature_annotations = true
show_source = true
extensions = [
  { griffe_pydantic = { schema = true } },
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
pymdownx.inlinehilite = {}
pymdownx.magiclink = {}
pymdownx.quotes = { callouts = true }
pymdownx.smartsymbols = {}
pymdownx.snippets = { base_path = ["."], check_paths = true }
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed = { alternate_style = true, combine_header_slug = true }
