# Rule catalogue for the XSD -> PyArrow converter (cdm_data_loaders.readers.xsd).
#
# This file and the per-case `case.yaml` manifests are the single source of truth for
# docs/xsd_to_pyarrow_specification.md, which is generated by scripts/gen_converter_spec.py.
# Every rule must be exercised by at least one case (enforced by tests/cdm_data_loaders/readers/test_xsd_spec.py).
title: XSD to PyArrow Specification
intro: |
  This document specifies how an XML Schema (`.xsd`) and a target `xml_tag` determine:

  1. The **PyArrow `pa.Schema`** of the table yielded by the pipeline (`generate_pyarrow_schema`).
  2. The **Python / JSON row dictionaries** produced by `convert_xml_element` before
     `pa.Table.from_pylist(rows, schema=pa_schema)`.
  3. The **errors** raised when an XSD or `xml_tag` uses unsupported or ambiguous constructs.

sections:
  - id: resolution
    title: Top-Level `xml_tag` Resolution and Unwrapping
    rules:
      - id: R-RESOLVE-DEPTH
        statement: |
          `xml_tag` is searched for among global elements (depth 0), then breadth-first through the content
          models of their types (depth 1, 2, ...). Matches at the shallowest depth are deduplicated by type
          identity; one type resolves, zero matches raise **E1**, and more than one distinct type raises **E2**.
      - id: R-RESOLVE-CLARK
        statement: |
          `xml_tag` may be a local name (`entry`) or Clark notation (`{http://example.org/ns}entry`); both
          resolve to the same declaration.
      - id: R-UNWRAP
        statement: |
          Each `<xml_tag>` element becomes one row. Its type must map to a `pa.struct` (see **E3**), and the
          struct's fields become the top-level columns of the `pa.Schema`.

  - id: naming
    title: Naming and Field Ordering
    rules:
      - id: R-NAME-ATTR
        statement: |
          Attributes become fields prefixed with `_` (`id` -> `_id`). Namespace declarations (`xmlns`,
          `xmlns:*`) and `xsi:*` attributes are stripped.
      - id: R-NAME-TEXT
        statement: |
          When a type has attributes and text (`simpleContent` with attributes, or `mixed="true"` with
          attributes), the text is stored in a field named `#text`.
      - id: R-ORDER
        statement: |
          Struct fields are ordered: declared attributes in declaration order (base type before extension),
          then `#text`, then child elements in content-model traversal order. A child name appearing in
          several branches or positions is emitted once, at its first appearance.

  - id: shape
    title: Element Classification (Shape)
    intro: |
      | XSD element type | Single (`overall_max_occurs == 1`) | Repeated (`> 1` or `unbounded`) |
      | :--- | :--- | :--- |
      | atomic `simpleType` | scalar | `pa.list_(scalar)` |
      | `xs:list` `simpleType` | `pa.list_(item)` | `pa.list_(pa.list_(item))` |
      | `simpleContent`, no attributes | as underlying `simpleType` | as underlying `simpleType`, listed |
      | `simpleContent` with attributes | `pa.struct([_attr..., #text])` | `pa.list_(pa.struct(...))` |
      | `mixed="true"`, no attributes | `pa.string()` (raw inner XML) | `pa.list_(pa.string())` |
      | `mixed="true"` with attributes | `pa.struct([_attr..., #text: string])` | `pa.list_(pa.struct(...))` |
      | attribute-only / element-only `complexType` | `pa.struct([...])` | `pa.list_(pa.struct(...))` |
      | empty `complexType` (no attrs, no children, not mixed) | `pa.string()` | `pa.list_(pa.string())` |
    rules:
      - id: R-SHAPE-CARDINALITY
        statement: |
          A child's `overall_max_occurs` is computed across the whole content model: element `maxOccurs`
          multiplied through enclosing compositors, summed over `xs:sequence` / `xs:all` positions and
          maximised over `xs:choice` branches. A value greater than 1 (including a child of a repeated
          compositor that itself has `maxOccurs="1"`) makes the field a `pa.list_`. `maxOccurs="0"` children
          are omitted.
      - id: R-SHAPE-GROUPS
        statement: |
          `xs:group` and `xs:attributeGroup` references are expanded in place; `xs:sequence`, `xs:choice`
          and `xs:all` contribute their elements to the enclosing struct.
      - id: R-SHAPE-EXTENSION
        statement: |
          `complexContent` / `xs:extension` merges base-type attributes and children with the extension's,
          base first.
      - id: R-SHAPE-XSLIST
        statement: |
          `xs:list` simple types, and the built-in list types `xs:NMTOKENS`, `xs:IDREFS`, `xs:ENTITIES`, map to
          `pa.list_(item)` and are coerced by splitting on whitespace and coercing each token.
      - id: R-SHAPE-SIMPLECONTENT
        statement: |
          `simpleContent` without attributes maps exactly like its base `simpleType`. With attributes it is a
          struct of the attribute fields followed by `#text`.
      - id: R-SHAPE-MIXED
        statement: |
          `mixed="true"` content is captured as the raw inner XML string; declared child elements are not
          emitted as fields. Inline tags (`<b>`, `<i>`, ...) are kept, text entities stay escaped (`&amp;`,
          `&lt;`, `&gt;`), and namespace declarations are dropped from inline tags.
      - id: R-SHAPE-ATTR-ONLY
        statement: |
          A `complexType` with attributes but no content maps to a struct of its attribute fields.
      - id: R-SHAPE-EMPTY-MARKER
        statement: |
          A `complexType` with no attributes, no children and no mixed content is an empty marker: it maps
          to `pa.string()`, with value `""` when present and `None` when absent.
      - id: R-SHAPE-CONTEXT-PATH
        statement: |
          Types are resolved per ancestor path from `xml_tag`, not per `(parent, child)` name pair, so the
          same child name under differently-typed parents gets each parent's exact type.
      - id: R-RECURSION
        statement: |
          Each complex type may be expanded at most `max_recursion_depth` times (default `2`) along a path.
          A deeper occurrence becomes `pa.string()` (or `pa.list_(pa.string())` when repeated) and its
          subtree is serialized with `json.dumps`. Applies to type self-recursion, element-`ref`
          self-recursion and mutual recursion. Truncated `pa.string()` fields carry no `xsd_type`.

  - id: nullability
    title: Field Nullability and Empty Tag Coercion
    rules:
      - id: R-NULL-ATTR
        statement: |
          Attribute fields are `nullable=False` when `use="required"` and the enclosing element is not
          `nillable="true"`; otherwise `nullable=True`.
      - id: R-NULL-CHILD
        statement: |
          A child field is `nullable=False` only when its overall `minOccurs` (multiplied through all
          enclosing compositors) is at least 1, it is not `nillable="true"`, and its parent element is not
          `nillable="true"`. Otherwise it is `nullable=True`.
      - id: R-NULL-CHOICE
        statement: |
          Elements that appear in only some branches of an `xs:choice` have overall `minOccurs == 0` and are
          therefore `nullable=True`.
      - id: R-NULL-NILLABLE-PARENT
        statement: |
          All attribute and child fields inside a `nillable="true"` complex element are `nullable=True`, since
          `<comment type="x" xsi:nil="true"/>` produces `{"_type": "x"}` with no children.
      - id: R-NULL-TEXT
        statement: |
          `#text` fields are always `nullable=True` (`<tag attr="x"/>` has no text), and list `item` fields
          are always `nullable=True`.
      - id: R-NIL
        statement: |
          `xsi:nil="true"` yields `None` for an element with no attributes, and a struct holding only its
          attributes otherwise.
      - id: R-EMPTY-COERCE
        statement: |
          A present empty element (`<tag/>`, no `xsi:nil`) that maps to a non-nullable `pa.string()` field is
          coerced to `""`, distinguishing it from an absent optional element (`None`). Empty markers are
          always `""` when present.

  - id: scalars
    title: Scalar Type Mapping and Field Metadata
    generated: scalar_table
    rules:
      - id: R-SCALAR-BUILTIN
        statement: |
          Built-in XSD types map to Arrow types per the table below. Unlisted built-ins fall back to
          `pa.string()`. `xs:boolean` accepts `true`/`1` and `false`/`0`; `xs:date` is coerced with
          `datetime.date.fromisoformat`; `xs:hexBinary` with `bytes.fromhex`; `xs:base64Binary` with
          `base64.b64decode`.
      - id: R-SCALAR-RESTRICTION
        statement: |
          `xs:restriction` types (including enumerations) inherit the mapping of their built-in base type.
      - id: R-SCALAR-UNION
        statement: |
          An `xs:union` uses the shared Arrow type when every member maps to the same type; otherwise it
          falls back to `pa.string()`. Its `xsd_type` joins the member names with `" | "`.
      - id: R-META-XSD-TYPE
        statement: |
          Every leaf scalar field (including `#text` and scalar list `item` fields) carries
          `metadata["xsd_type"]` with the built-in `xs:` name. Struct, outer list, empty-marker and
          recursion-truncated fields do not.
      - id: R-META-COMMENT
        statement: |
          `<xs:annotation><xs:documentation>` on an element or attribute (or, failing that, on its `ref`
          target or type) is whitespace-normalized and stored in `metadata["comment"]`.
